$kind: http-request
name: 'Update Supplier'
description: |-
  **Integration Test — Step 4 of 5**
  Updates the supplier created in step 1. Verifies the updated fields are reflected in the response.
url: '{{baseUrl}}/suppliers/:supplierId'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: supplierId
    value: '{{it_supplierId}}'
body:
  type: json
  content: |-
    {
      "name": "Integration Test Distributors Pro",
      "email": "support@integrationtestpro.com",
      "phone": "+1-800-555-8888"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Supplier name was updated", function () {
        const json = pm.response.json();
        pm.expect(json.name).to.eql("Integration Test Distributors Pro");
      });

      pm.test("Supplier email was updated", function () {
        const json = pm.response.json();
        pm.expect(json.email).to.eql("support@integrationtestpro.com");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 4000
