$kind: http-request
name: 'Get Supplier'
description: |-
  **Integration Test — Step 3 of 5**
  Fetches the specific supplier created in step 1 by its `it_supplierId`.
url: '{{baseUrl}}/suppliers/:supplierId'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: supplierId
    value: '{{it_supplierId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Supplier ID matches created supplier", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(pm.collectionVariables.get("it_supplierId"));
      });

      pm.test("Supplier has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("name");
        pm.expect(json).to.have.property("email");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 3000
