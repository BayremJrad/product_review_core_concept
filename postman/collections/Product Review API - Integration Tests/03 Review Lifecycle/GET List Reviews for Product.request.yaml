$kind: http-request
name: 'List Reviews for Product'
description: |-
  **Integration Test — Step 2 of 5**
  Lists all reviews for the product. Verifies the newly created review appears in the results.
url: '{{baseUrl}}/products/:productId/reviews'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '10'
pathVariables:
  - key: productId
    value: '{{it_productId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is an array or paginated object", function () {
        const json = pm.response.json();
        const isArray = Array.isArray(json);
        const isPaginated = typeof json === "object" && (Array.isArray(json.data) || Array.isArray(json.reviews) || Array.isArray(json.items));
        pm.expect(isArray || isPaginated).to.be.true;
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 2000
