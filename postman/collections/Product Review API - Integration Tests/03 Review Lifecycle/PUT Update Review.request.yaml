$kind: http-request
name: 'Update Review'
description: |-
  **Integration Test — Step 4 of 5**
  Updates the review created in step 1. Verifies the updated fields are reflected in the response.
url: '{{baseUrl}}/reviews/:reviewId'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: reviewId
    value: '{{it_reviewId}}'
body:
  type: json
  content: |-
    {
      "rating": 4,
      "title": "Updated Integration Test Review",
      "body": "This review was updated by an automated integration test."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Review rating was updated", function () {
        const json = pm.response.json();
        pm.expect(json.rating).to.eql(4);
      });

      pm.test("Review title was updated", function () {
        const json = pm.response.json();
        pm.expect(json.title).to.eql("Updated Integration Test Review");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 4000
