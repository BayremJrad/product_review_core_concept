$kind: http-request
name: 'Create Review'
description: |-
  **Integration Test — Step 1 of 5**
  Creates a review for a product. Uses `it_productId` and `it_userId` from the Product and User Auth flows.
  Captures `it_reviewId` for downstream review tests.
  
  **Prerequisite:** Run "02 Product Lifecycle / POST Create Product" first to populate `it_productId`.
url: '{{baseUrl}}/products/:productId/reviews'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: productId
    value: '{{it_productId}}'
body:
  type: json
  content: |-
    {
      "rating": 5,
      "title": "Integration Test Review",
      "body": "This review was created by an automated integration test.",
      "userId": "{{it_userId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has review object with id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("rating");
        pm.expect(json).to.have.property("title");
      });

      pm.test("Review rating matches request", function () {
        const json = pm.response.json();
        pm.expect(json.rating).to.eql(5);
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Capture reviewId for downstream tests
      const json = pm.response.json();
      if (json.id) {
        pm.collectionVariables.set("it_reviewId", json.id);
      }
order: 1000
