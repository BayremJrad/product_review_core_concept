$kind: http-request
name: 'Get Review'
description: |-
  **Integration Test — Step 3 of 5**
  Fetches the specific review created in step 1 by its `it_reviewId`.
url: '{{baseUrl}}/reviews/:reviewId'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: reviewId
    value: '{{it_reviewId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Review ID matches created review", function () {
        const json = pm.response.json();
        pm.expect(json.id).to.eql(pm.collectionVariables.get("it_reviewId"));
      });

      pm.test("Review has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("rating");
        pm.expect(json).to.have.property("title");
        pm.expect(json).to.have.property("body");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 3000
