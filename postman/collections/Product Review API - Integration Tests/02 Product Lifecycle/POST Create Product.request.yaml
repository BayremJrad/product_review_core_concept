$kind: http-request
name: 'Create Product'
description: |-
  **Integration Test — Step 1 of 5**
  Creates a new product. Captures `it_productId` for use in subsequent product lifecycle tests.
url: '{{baseUrl}}/products'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
body:
  type: json
  content: |-
    {
      "name": "Integration Test Headphones",
      "description": "Created by automated integration test",
      "category": "Electronics",
      "price": 149.99,
      "imageUrl": "https://example.com/images/test-headphones.jpg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has product object with id", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("name");
        pm.expect(json).to.have.property("price");
      });

      pm.test("Product name matches request", function () {
        const json = pm.response.json();
        pm.expect(json.name).to.eql("Integration Test Headphones");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Capture productId for downstream tests
      const json = pm.response.json();
      if (json.id) {
        pm.collectionVariables.set("it_productId", json.id);
      }
order: 1000
