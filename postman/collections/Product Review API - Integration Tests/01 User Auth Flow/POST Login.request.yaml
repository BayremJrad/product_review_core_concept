$kind: http-request
name: 'Login'
description: |-
  **Integration Test — Step 2 of 4**
  Logs in with the registered user credentials. Captures the auth `token` for use in authenticated requests.
url: '{{baseUrl}}/users/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john.doe@example.com",
      "password": "SecurePass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains auth token", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("token");
        pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      pm.test("Response contains user info", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Store token for authenticated requests
      const json = pm.response.json();
      if (json.token) {
        pm.collectionVariables.set("it_token", json.token);
      }
      if (json.id) {
        pm.collectionVariables.set("it_userId", json.id);
      }
order: 2000
