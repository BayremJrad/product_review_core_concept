$kind: http-request
name: 'Get User Profile'
description: |-
  **Integration Test — Step 3 of 4**
  Fetches the profile of the registered user using the `it_userId` captured in the Register step.
url: '{{baseUrl}}/users/:userId'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: userId
    value: '{{it_userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Profile belongs to registered user", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.eql(pm.collectionVariables.get("it_userId"));
      });

      pm.test("Profile has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("username");
        pm.expect(json).to.have.property("email");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 3000
