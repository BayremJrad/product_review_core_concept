$kind: http-request
name: 'Update User Profile'
description: |-
  **Integration Test — Step 4 of 4**
  Updates the registered user's profile. Verifies the update is reflected in the response.
url: '{{baseUrl}}/users/:userId'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{it_token}}'
pathVariables:
  - key: userId
    value: '{{it_userId}}'
body:
  type: json
  content: |-
    {
      "username": "integration_tester",
      "bio": "Automated integration test user"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Username was updated", function () {
        const json = pm.response.json();
        pm.expect(json.username).to.eql("integration_tester");
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 4000
