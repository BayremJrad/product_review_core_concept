$kind: http-example
request:
  url: "{{baseUrl}}/products/:productId/suppliers"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    productId: prod_001
  body:
    type: json
    content: |-
      {
        "name": "TechDistributors Inc.",
        "email": "contact@techdistributors.com",
        "phone": "+1-800-555-0199",
        "address": "123 Supply Chain Ave, San Francisco, CA 94105",
        "country": "US",
        "website": "https://techdistributors.com"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Request body validation failed.",
          "details": [
            {
              "field": "name",
              "message": "name is required"
            },
            {
              "field": "email",
              "message": "email must be a valid email address"
            }
          ]
        }
      }
order: 2000
