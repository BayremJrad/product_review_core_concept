$kind: http-example
request:
  url: "{{baseUrl}}/products/:productId/suppliers/:supplierId"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    productId: prod_001
    supplierId: sup_001
  body:
    type: json
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "message": "Supplier successfully removed from product.",
        "data": {
          "productId": "prod_001",
          "supplierId": "sup_001"
        }
      }
order: 1000
