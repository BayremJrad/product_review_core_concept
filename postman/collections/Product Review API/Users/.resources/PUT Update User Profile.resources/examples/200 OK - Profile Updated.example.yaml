$kind: http-example
request:
  url: "{{baseUrl}}/users/:userId"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    userId: user_123
  body:
    type: json
    content: |-
      {
        "username": "johndoe_updated",
        "bio": "Avid tech reviewer"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "data": {
          "user": {
            "id": "user_123",
            "username": "johndoe_updated",
            "bio": "Avid tech reviewer",
            "updatedAt": "2024-06-15T16:00:00Z"
          }
        }
      }
order: 1000
