$kind: http-example
request:
  url: "{{baseUrl}}/users/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "username": "johndoe",
        "email": "john.doe@example.com",
        "password": "SecurePass123!"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "data": {
          "user": {
            "id": "user_123",
            "username": "johndoe",
            "email": "john.doe@example.com",
            "createdAt": "2024-06-01T08:00:00Z"
          },
          "token": "{{supabase_service_role_api_key_05iy}}"
        }
      }
order: 1000
