$kind: http-example
request:
  url: "{{baseUrl}}/products/:productId"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    productId: prod_001
  body:
    type: json
    content: |-
      {
        "name": "Wireless Headphones Pro",
        "description": "Premium noise-cancelling wireless headphones with extended battery",
        "price": 249.99
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "data": {
          "product": {
            "id": "prod_001",
            "name": "Wireless Headphones Pro",
            "description": "Premium noise-cancelling wireless headphones with extended battery",
            "category": "Electronics",
            "price": 249.99,
            "averageRating": 4.5,
            "reviewCount": 128,
            "imageUrl": "https://example.com/images/headphones.jpg",
            "updatedAt": "2024-06-15T11:30:00Z"
          }
        }
      }
order: 1000
